services:
  app:
    image: 559610805985.dkr.ecr.us-west-2.amazonaws.com/owlchirp:v2-11-02-26
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      APP_PORT: "${APP_PORT:-4444}"
      HOST: "${HOST:-0.0.0.0}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DEV_MODE: "${DEV_MODE:-false}"
      # Subdirectory the browser sees, e.g. /owlchirp (reverse proxy must strip it).
      BASE_PATH: "${BASE_PATH:-}"
      DB_DSN: "${DB_DSN:-/data/owlchirp.sqlite3}"
      CONNECT_INSTANCE: "${CONNECT_INSTANCE}"
      CONNECT_DOMAIN: "${CONNECT_DOMAIN}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-west-2}"
      AWS_CONNECT_CACHE_LENGTH: "${AWS_CONNECT_CACHE_LENGTH:-10}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      TIME_ZONE: "${TIME_ZONE:-America/Los_Angeles}"
      TELEMETRY_URL: "${TELEMETRY_URL:-}"
      # Web push notifications (not yet read by the backend)
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
    volumes:
      - ./_data:/data
    ports:
      - "${APP_PORT:-4444}:${APP_PORT:-4444}"

